name: GiftLink CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd:
    name: GiftLink CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run Linter
        run: |
          jshint backend/index.js
          jshint backend/routes/*.js
          jshint backend/controllers/*.js

      - name: Complete job
        run: echo "GiftLink CI/CD completed successfully"